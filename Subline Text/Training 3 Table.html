<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Spanding Row and Column in a Table</title>
</head>
<body>
<table border="2px" cellpadding="20px" cellspacing="20px" width="90%" bordercolor="green">
	<tr>
		<th colspan="4">Item List</th>
	</tr>
	<tr>
		<td>Item Name</td>
		<td colspan="2">Description</td>
		<td>Price</td>
	</tr>
	<tr>
		<td rowspan="2">Keyboard</td>
		<td>USB</td>
		<td>Prolink</td>
		<td>$ 4.5</td>
	</tr>
	<tr>
		<td>USB</td>
		<td>Prolink</td>
		<td>$ 4.5</td>
	</tr>
</table>
</body>
</html>
