<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>List Style Type</title>
</head>
<style>	ul li{list-style-type: circle;list-style-position: inside;}
		li{border: 1px solid black;}</style>
<body>
	<ul>
		<li>Pizza</li>
		<li>Hotdogs</li>
		<li>Burgers</li>
		<li>Coffee</li>
		<li>Sandwich</li>
	</ul>
</body>
</html>
