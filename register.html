    <div class="container register-container">
        <div class="card register-card">

            <div class="register-header">
                <h2 class="text-white">Create Account</h2>
                <p>Join Camping o'clock today</p>
            </div>

            <div class="register-body">
                <form onsubmit="registerUser(event)">

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="fullname" class="form-control" placeholder="Enter your name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Create password"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password"
                            required>
                    </div>

                    <button type="submit" class="btn btn-register text-white w-100 py-2">
                        Register
                    </button>

                    <p class="text-center mt-3 mb-0">
                        Already have an account?
                        <a href="login.html">Login</a>
                    </p>

                </form>
            </div>
        </div>
    </div>
    <!-- booststrap js link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- Register JS -->
    <script>
        function registerUser(event) {
            event.preventDefault();

            const fullname = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            const user = {
                fullname,
                email,
                password
            };

            localStorage.setItem('registeredUser', JSON.stringify(user));

            alert('Registration successful!');

            window.location.href = 'login.html';
        }
    </script>
